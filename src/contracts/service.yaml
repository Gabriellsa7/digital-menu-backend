      - $ref: '#/components/parameters/OrderId'
    post:
      tags:
        - Customer orders
      summary: Pay an order with a card (simulated)
      operationId: payOrderWithCard
      description: '4242 4242 4242 4242 is approved, 4000 0000 0000 0002 is declined and any other number is invalid. After 3 failures the order is canceled (PAY-R03, R05). Only brand and last 4 digits are stored.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPaymentRequest'
