    CardPaymentRequest:
      type: object
      additionalProperties: false
      required:
        - number
        - holder
        - expiry
        - cvv
      properties:
        number:
          type: string
          pattern: '^[0-9 ]{12,23}$'
        holder:
          type: string
          minLength: 2
          maxLength: 60
        expiry:
          type: string
          pattern: '^(0[1-9]|1[0-2])/\d{2}$'
          example: '12/30'
        cvv:
          type: string
          pattern: '^\d{3,4}$'
    OrderSummary:
      type: object
      required:
        - id
        - number
        - status
        - fulfillmentType
        - totalInCents
        - itemsCount
        - paymentMethod
        - paymentStatus
        - customerName
        - createdAt
      properties:
        id:
          type: string
        number:
          type: integer
        status:
          $ref: '#/components/schemas/OrderStatus'
        fulfillmentType:
          $ref: '#/components/schemas/FulfillmentType'
        totalInCents:
          type: integer
        itemsCount:
          type: integer
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        customerName:
          type: string
        createdAt:
          type: string
          format: date-time
    OrderList:
      type: object
      required:
        - items
        - total
        - page
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    ReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
    ChangeOrderStatusRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PREPARING
            - READY
            - OUT_FOR_DELIVERY
            - COMPLETED
        estimatedMinutes:
          type: integer
          minimum: 1
          maximum: 240
    RequiredReasonRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
    Error:
      type: object
      required:
        - message
        - status
      properties:
        message:
          type: string
          description: Error message describing what went wrong
          example: 'Customer not found'
        status:
          type: integer
          description: HTTP status code
          example: 404
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
          example: '2025-07-15T17:30:00.000Z'
        path:
          type: string
          description: The API endpoint that generated the error
          example: '/me'
        code:
          type: string
          description: Machine-readable reason from the business rules (e.g. ADDRESS_LIMIT_REACHED)
          example: 'ADDRESS_LIMIT_REACHED'
        details:
          type: object
          additionalProperties: true
          description: Extra context for the error
        errors:
          type: array
          description: Validator errors (when the request does not match the contract)
          items:
            type: object
    ValidationError:
      type: object
      required:
        - message
        - status
        - errors
      properties:
        message:
          type: string
          description: General validation error message
          example: 'Validation failed'
        status:
          type: integer
          description: HTTP status code
          example: 400
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
          example: '2025-07-15T17:30:00.000Z'
        path:
          type: string
          description: The API endpoint that generated the error
          example: '/me/addresses'
        errors:
          type: array
          description: List of specific validation errors
          items:
            type: object
            properties:
              field:
                type: string
                description: The field that failed validation
                example: 'email'
              message:
                type: string
                description: The validation error message
                example: 'Email is required'
              value:
                type: string
                description: The invalid value provided
                example: ''
