        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Admin orders
      summary: Cancel an order in preparation or ready
      operationId: cancelOrderByStaff
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequiredReasonRequest'
      responses:
        '200':
          description: The canceled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    StoreSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: The slug of the store (e.g. casa-brasa)

    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: string
      description: The ID of the address

    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the resource

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
      description: The ID of the order

  responses:
    BadRequest:
      description: Request does not match the contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The authenticated subject cannot access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicts with the current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Breaks a business rule (see `code`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Throttled; retry after the `Retry-After` header
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    OtpRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          minLength: 10
          maxLength: 20
          description: Brazilian mobile phone in any format
          example: '(11) 99999-8888'
    OtpRequestResponse:
      type: object
      required:
        - phone
        - expiresInSeconds
        - retryAfterSeconds
      properties:
        phone:
          type: string
          description: Normalized E.164 phone
          example: '+5511999998888'
        expiresInSeconds:
          type: integer
          example: 300
        retryAfterSeconds:
          type: integer
          example: 60
        debugCode:
          type: string
          description: Simulated SMS code, only when the demo mode is on
          example: '482913'
    OtpVerifyRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
          minLength: 10
          maxLength: 20
        code:
          type: string
          pattern: '^\d{6}$'
    GoogleLoginRequest:
      type: object
      required:
        - idToken
      properties:
        idToken:
          type: string
          minLength: 1
          description: Google ID token (`credential` from Google Identity Services)
    AccessTokenResponse:
      type: object
      required:
        - accessToken
        - accessTokenExpiresInSeconds
      properties:
        accessToken:
          type: string
        accessTokenExpiresInSeconds:
          type: integer
          example: 900
    CustomerAuthResponse:
      allOf:
        - $ref: '#/components/schemas/AccessTokenResponse'
        - type: object
          required:
            - isNew
            - customer
          properties:
            isNew:
              type: boolean
              description: True when this login created the account
            customer:
              $ref: '#/components/schemas/Customer'
    Customer:
      type: object
      required:
        - id
        - isPhoneVerified
        - isGoogleLinked
        - addresses
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
          description: E.164 phone
        isPhoneVerified:
          type: boolean
          description: True when the phone was verified by SMS (login identity)
        email:
          type: string
          format: email
        avatarUrl:
          type: string
        isGoogleLinked:
          type: boolean
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        createdAt:
          type: string
          format: date-time
    UpdateCustomerRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
          nullable: true
          minLength: 10
          maxLength: 20
          description: Contact phone; null removes it
    AddressRequest:
      type: object
      required:
        - label
        - zipCode
        - street
        - number
        - neighborhood
        - city
        - state
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 30
          example: 'Casa'
        zipCode:
          type: string
          pattern: '^\d{8}$'
          example: '04101300'
        street:
          type: string
          minLength: 1
          maxLength: 120
        number:
          type: string
          minLength: 1
          maxLength: 10
        complement:
          type: string
          maxLength: 60
        neighborhood:
          type: string
          minLength: 1
          maxLength: 80
        city:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          pattern: '^[A-Z]{2}$'
          example: 'SP'
        reference:
          type: string
          maxLength: 120
    NewAddressRequest:
      allOf:
        - $ref: '#/components/schemas/AddressRequest'
        - type: object
          properties:
            isDefault:
              type: boolean
    Address:
      type: object
      required:
        - id
        - label
        - zipCode
        - street
        - number
        - neighborhood
        - city
        - state
        - isDefault
      properties:
        id:
          type: string
        label:
          type: string
        zipCode:
          type: string
        street:
          type: string
        number:
          type: string
        complement:
          type: string
        neighborhood:
          type: string
        city:
          type: string
        state:
          type: string
        reference:
          type: string
        deliveryZoneId:
          type: string
          description: Present only when the address is served (CUS-R03)
        isDefault:
          type: boolean
    StaffLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
    StaffAuthResponse:
      allOf:
        - $ref: '#/components/schemas/AccessTokenResponse'
        - type: object
          required:
            - staffUser
          properties:
            staffUser:
              $ref: '#/components/schemas/StaffUser'
    StaffUser:
      type: object
      required:
        - id
        - name
        - email
        - role
        - isActive
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - OWNER
            - STAFF
        isActive:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    Password:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^(?=.*[A-Za-z])(?=.*\d).+$'
      description: At least 8 characters with 1 letter and 1 number (STF-R02)
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          $ref: '#/components/schemas/Password'
    CreateStaffUserRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
        - role
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/Password'
        role:
          type: string
          enum:
            - OWNER
            - STAFF
    UpdateStaffUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        role:
          type: string
          enum:
            - OWNER
            - STAFF
    SetActiveRequest:
      type: object
      additionalProperties: false
      required:
        - isActive
      properties:
        isActive:
          type: boolean
    ManualStatus:
      type: string
      enum:
        - AUTO
        - FORCED_OPEN
        - FORCED_CLOSED
    OpeningHour:
      type: object
      additionalProperties: false
      required:
        - weekday
        - opensAt
        - closesAt
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday
        opensAt:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '18:00'
        closesAt:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: May be earlier than opensAt when the interval crosses midnight
          example: '02:00'
    StoreAddress:
      type: object
      additionalProperties: false
      required:
        - zipCode
        - street
        - number
        - neighborhood
        - city
        - state
      properties:
        zipCode:
          type: string
        street:
          type: string
        number:
          type: string
        complement:
          type: string
        neighborhood:
          type: string
        city:
          type: string
        state:
          type: string
        reference:
          type: string
    StoreStatus:
      type: object
      required:
        - isOpenNow
        - manualStatus
      properties:
        isOpenNow:
          type: boolean
        manualStatus:
          $ref: '#/components/schemas/ManualStatus'
        closesAt:
          type: string
          format: date-time
        nextOpeningAt:
          type: string
          format: date-time
    Store:
      type: object
      required:
        - id
        - name
        - slug
        - description
        - phone
        - address
        - timezone
        - openingHours
        - minimumOrderInCents
        - deliveryEnabled
        - pickupEnabled
        - pickupEtaMinutes
        - status
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        phone:
          type: string
        logoUrl:
          type: string
        bannerUrl:
          type: string
        address:
          $ref: '#/components/schemas/StoreAddress'
        timezone:
          type: string
          example: America/Sao_Paulo
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHour'
        minimumOrderInCents:
          type: integer
        deliveryEnabled:
          type: boolean
        pickupEnabled:
          type: boolean
        pickupEtaMinutes:
          type: integer
        status:
          $ref: '#/components/schemas/StoreStatus'
    UpdateStoreRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 60
        description:
          type: string
          maxLength: 500
        phone:
          type: string
          maxLength: 20
        address:
          $ref: '#/components/schemas/StoreAddress'
        timezone:
          type: string
          minLength: 1
        minimumOrderInCents:
          type: integer
          minimum: 0
        deliveryEnabled:
          type: boolean
        pickupEnabled:
          type: boolean
        pickupEtaMinutes:
          type: integer
          minimum: 1
          maximum: 240
    SetOpeningHoursRequest:
      type: object
      additionalProperties: false
      required:
        - openingHours
      properties:
        openingHours:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/OpeningHour'
    SetStoreStatusRequest:
      type: object
      additionalProperties: false
      required:
        - manualStatus
      properties:
        manualStatus:
          $ref: '#/components/schemas/ManualStatus'
    PublicDeliveryZone:
      type: object
      required:
        - id
        - name
        - city
        - feeInCents
        - etaMinMinutes
        - etaMaxMinutes
      properties:
        id:
          type: string
        name:
          type: string
          example: Vila Mariana
        city:
          type: string
          example: São Paulo
        feeInCents:
          type: integer
          example: 590
        etaMinMinutes:
          type: integer
          example: 30
        etaMaxMinutes:
          type: integer
          example: 45
    DeliveryZone:
      allOf:
        - $ref: '#/components/schemas/PublicDeliveryZone'
        - type: object
          required:
            - isActive
            - createdAt
          properties:
            isActive:
              type: boolean
            createdAt:
              type: string
              format: date-time
    DeliveryZoneRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - city
        - feeInCents
        - etaMinMinutes
        - etaMaxMinutes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        city:
          type: string
          minLength: 1
          maxLength: 80
        feeInCents:
          type: integer
          minimum: 0
        etaMinMinutes:
          type: integer
          minimum: 1
          maximum: 240
        etaMaxMinutes:
          type: integer
          minimum: 1
          maximum: 240
        isActive:
          type: boolean
    Category:
      type: object
      required:
        - id
        - name
        - position
        - isActive
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
          example: Burgers
        position:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        isActive:
          type: boolean
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        isActive:
          type: boolean
    ReorderRequest:
      type: object
      additionalProperties: false
      required:
        - ids
      properties:
        ids:
          type: array
          maxItems: 500
          items:
            type: string
    Option:
      type: object
      required:
        - id
        - name
        - priceInCents
        - isAvailable
      properties:
        id:
          type: string
        name:
          type: string
          example: Bacon
        priceInCents:
          type: integer
          example: 400
        isAvailable:
