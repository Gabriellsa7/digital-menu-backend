              type: array
              items:
                type: object
                required:
                  - status
                  - at
                  - by
                properties:
                  status:
                    $ref: '#/components/schemas/OrderStatus'
                  at:
                    type: string
                    format: date-time
                  by:
                    type: object
                    required:
                      - type
                    properties:
                      type:
                        type: string
                        enum:
                          - CUSTOMER
                          - STAFF
                          - SYSTEM
                      id:
                        type: string
                  reason:
                    type: string
            notes:
              type: string
            estimatedReadyAt:
              type: string
              format: date-time
            cancelReason:
              type: string
