openapi: 3.0.2
info:
  title: Digital Menu API
  description: REST API of Digital Menu, a single-store food ordering system.
  version: 1.0.0
  contact:
    name: API Support
    url: https://example.com/support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: https://staging-api.example.com/v1
    description: Staging server
  - url: http://localhost

tags:
  - name: Customer auth
    description: Customer login with Google or SMS code, session refresh and logout
  - name: Customer
    description: Logged-in customer profile and addresses
  - name: Staff auth
    description: Store team login with e-mail and password, session refresh and logout
  - name: Staff users
    description: Store team profile and management (owner only)
  - name: Store
    description: Store settings, opening hours and open/closed status
  - name: Delivery zones
    description: Neighborhoods served by the store, with fee and ETA
  - name: Catalog
    description: Categories, option groups and products managed by the store team
  - name: Menu
    description: Public storefront menu
  - name: Coupons
    description: Discount coupons managed by the owner and validated by customers
  - name: Customer orders
    description: Checkout, order history and payments of the logged-in customer
  - name: Admin orders
    description: Order board and lifecycle for the store team

paths:
  /auth/customer/otp/request:
    post:
      tags:
        - Customer auth
      summary: Request an SMS login code
      operationId: requestCustomerOtpCode
      description: Sends a 6-digit code by SMS (simulated). When the demo mode is on, the code is returned as `debugCode`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/customer/otp/verify:
    post:
      tags:
        - Customer auth
      summary: Log in with an SMS code
      operationId: loginCustomerWithOtp
      description: Verifies the code, signs the customer up on the first login and starts a session. The refresh token is set as an httpOnly cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/customer/google:
    post:
      tags:
        - Customer auth
      summary: Log in with Google
      operationId: loginCustomerWithGoogle
      description: Verifies a Google ID token, signs the customer up on the first login and starts a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/customer/refresh:
    post:
      tags:
        - Customer auth
      summary: Refresh the customer session
      operationId: refreshCustomerSession
      description: Rotates the refresh cookie and returns a new access token. Reusing an old refresh token revokes the whole session family.
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/customer/logout:
    post:
      tags:
        - Customer auth
      summary: Log out
      operationId: logoutCustomer
      description: Revokes the current session and clears the session cookies.
      responses:
        '204':
          description: Logged out
        '500':
          $ref: '#/components/responses/ServerError'

  /me:
    get:
      tags:
        - Customer
      summary: Get the logged-in customer
      operationId: getCustomerProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Customer
      summary: Update the customer profile
      operationId: updateCustomerProfile
      description: Updates the name and/or the contact phone. Send `phone` as null to remove it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: The updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'

  /me/identities/google:
    post:
      tags:
        - Customer
      summary: Link a Google account
      operationId: linkCustomerGoogleAccount
      description: Links a Google account so the customer can log in with Google or SMS.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: The updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /me/addresses:
    get:
      tags:
        - Customer
      summary: List saved addresses
      operationId: listCustomerAddresses
      description: With `storeId`, each address carries the `deliveryZoneId` of that store that serves it (CUS-R03). Zones are never stored on the address.
      security:
        - bearerAuth: []
      parameters:
        - name: storeId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Customer
      summary: Save a new address
      operationId: addCustomerAddress
      description: The delivery zone is resolved from the neighborhood and city. At most 5 addresses per customer.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAddressRequest'
      responses:
        '201':
          description: The saved address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'

  /me/addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    put:
      tags:
        - Customer
      summary: Replace an address
      operationId: updateCustomerAddress
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '200':
          description: The updated address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Customer
      summary: Remove an address
      operationId: removeCustomerAddress
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Address removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /me/addresses/{addressId}/default:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    patch:
      tags:
        - Customer
      summary: Set the default address
      operationId: setCustomerDefaultAddress
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All addresses with the new default
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/staff/login:
    post:
      tags:
        - Staff auth
      summary: Log in as a staff user
      operationId: loginStaff
      description: Checks the e-mail and password and starts a session. The refresh token is set as an httpOnly cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/staff/refresh:
    post:
      tags:
        - Staff auth
      summary: Refresh the staff session
      operationId: refreshStaffSession
      description: Rotates the refresh cookie and returns a new access token. Inactive users cannot refresh.
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/staff/logout:
    post:
      tags:
        - Staff auth
      summary: Log out the staff user
      operationId: logoutStaff
      description: Revokes the current session and clears the session cookie.
      responses:
        '204':
          description: Logged out
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/me:
    get:
      tags:
        - Staff users
      summary: Get the logged-in staff user
      operationId: getStaffProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The staff user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/me/password:
    patch:
      tags:
        - Staff users
      summary: Change the own password
      operationId: changeStaffPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/staff-users:
    get:
      tags:
        - Staff users
      summary: List the team
      operationId: listStaffUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every staff user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Staff users
      summary: Create a staff user
      operationId: createStaffUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffUserRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/staff-users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags:
        - Staff users
      summary: Update the name or role of a staff user
      operationId: updateStaffUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffUserRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/staff-users/{id}/active:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags:
        - Staff users
      summary: Activate or deactivate a staff user
      operationId: setStaffUserActive
      description: Deactivating revokes every session of the user (STF-R05).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetActiveRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'

  /public/stores/{slug}:
    parameters:
      - $ref: '#/components/parameters/StoreSlug'
    get:
      tags:
        - Store
      summary: Get a published store by its slug, with its current status
      operationId: getPublicStore
      description: Unknown, inactive, or unpublished slugs answer 404 STORE_NOT_FOUND (TEN-R06).
      responses:
        '200':
          description: The store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/store:
    get:
      tags:
        - Store
      summary: Get the store settings
      operationId: getAdminStore
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Store
      summary: Update the store settings (owner)
      operationId: updateStore
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/store/opening-hours:
    put:
      tags:
        - Store
      summary: Replace the whole opening schedule (owner)
      operationId: setStoreOpeningHours
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetOpeningHoursRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/store/status:
    patch:
      tags:
        - Store
      summary: Force the store open or closed, or follow the schedule
      operationId: setStoreStatus
      description: A forced status goes back to AUTO at the next scheduled boundary (STO-R05).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetStoreStatusRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /public/stores/{slug}/delivery-zones:
    parameters:
      - $ref: '#/components/parameters/StoreSlug'
    get:
      tags:
        - Delivery zones
      summary: List the active delivery zones of a published store
      operationId: listPublicDeliveryZones
      responses:
        '200':
          description: Active zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicDeliveryZone'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /public/stores/{slug}/delivery-zones/resolve:
    parameters:
      - $ref: '#/components/parameters/StoreSlug'
    get:
      tags:
        - Delivery zones
      summary: Find the zone of a store that serves a neighborhood
      operationId: resolveDeliveryZone
      description: Matching ignores accents, casing and extra spaces (CUS-R03).
      parameters:
        - name: neighborhood
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: city
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
      responses:
        '200':
          description: The matched zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDeliveryZone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/delivery-zones:
    get:
      tags:
        - Delivery zones
      summary: List every delivery zone
      operationId: listDeliveryZones
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every zone
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryZone'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Delivery zones
      summary: Create a delivery zone (owner)
      operationId: createDeliveryZone
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryZoneRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/delivery-zones/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags:
        - Delivery zones
      summary: Update a delivery zone (owner)
      operationId: updateDeliveryZone
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryZoneRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Delivery zones
      summary: Delete a delivery zone (owner)
      operationId: deleteDeliveryZone
      security:
