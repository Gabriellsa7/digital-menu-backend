  /me/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags:
        - Customer orders
      summary: Get an own order with its history and payment
      operationId: getCustomerOrder
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /me/orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags:
        - Customer orders
      summary: Cancel an own order
      operationId: cancelCustomerOrder
      description: Allowed while AWAITING_PAYMENT or PLACED (ORD-R15). Approved payments are refunded (ORD-R16).
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The canceled order
          content:
            application/json:
